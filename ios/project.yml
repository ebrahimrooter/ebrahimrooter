# XcodeGen spec:  brew install xcodegen && cd ios && xcodegen generate && open BankAssistant.xcodeproj
# Set DEVELOPMENT_TEAM and the bundle ids below (or in Xcode → Signing & Capabilities).
name: BankAssistant
options:
  bundleIdPrefix: ir.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fa
settings:
  base:
    DEVELOPMENT_TEAM: ""            # your Apple team id
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BankAssistant:
    type: application
    platform: iOS
    sources:
      - path: BankAssistant
        excludes: ["Resources/Info.plist", "Resources/*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.example.bankassistant
        CODE_SIGN_ENTITLEMENTS: BankAssistant/Resources/BankAssistant.entitlements
        INFOPLIST_FILE: BankAssistant/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AssistantWidgets
  AssistantWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AssistantWidgets
        excludes: ["Info.plist"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.example.bankassistant.widgets
        INFOPLIST_FILE: AssistantWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
