<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Vazirmatn, Tahoma, sans-serif">
  <style>
    .fa { direction: rtl; unicode-bidi: embed; }
    .pin { font-size: 15px; font-weight: 700; fill: #16211f; }
    .small { font-size: 13px; fill: #5d6d69; }
  </style>
  <rect width="1000" height="700" fill="#fff"/>
  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#16211f">ESP32 + SIM800L</text>

  <!-- adapter -->
  <rect x="30" y="72" width="160" height="80" rx="10" fill="#f3f6f5" stroke="#5d6d69" stroke-width="2"/>
  <text class="fa" x="110" y="104" text-anchor="middle" font-size="16" font-weight="700">آداپتور</text>
  <text class="fa small" x="110" y="128" text-anchor="middle">۵ تا ۱۲ ولت، ۲ آمپر</text>
  <line x1="190" y1="100" x2="240" y2="100" stroke="#c62828" stroke-width="4"/>
  <line x1="190" y1="130" x2="240" y2="130" stroke="#222" stroke-width="4"/>

  <!-- buck -->
  <rect x="240" y="62" width="190" height="100" rx="10" fill="#fff6e0" stroke="#b07a00" stroke-width="2"/>
  <text x="335" y="88" text-anchor="middle" font-size="15" font-weight="700">LM2596</text>
  <text class="fa" x="335" y="110" text-anchor="middle" font-size="13" fill="#7a4d00">ماژول کاهنده‌ی ولتاژ</text>
  <text class="fa" x="335" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">خروجی را ۴٫۰ ولت کن</text>
  <text class="fa small" x="335" y="152" text-anchor="middle" font-size="11">(با مولتی‌متر، قبل از وصل کردن)</text>

  <!-- VCC red -->
  <polyline points="430,100 580,100 580,190 620,190" fill="none" stroke="#c62828" stroke-width="4"/>
  <text x="480" y="92" font-size="13" font-weight="700" fill="#c62828">+4.0V</text>
  <!-- GND black bus -->
  <polyline points="430,130 520,130 520,620 300,620" fill="none" stroke="#222" stroke-width="4"/>
  <line x1="520" y1="310" x2="620" y2="310" stroke="#222" stroke-width="4"/>
  <circle cx="520" cy="310" r="6" fill="#222"/>

  <!-- capacitor between VCC and GND -->
  <line x1="580" y1="160" x2="557" y2="160" stroke="#c62828" stroke-width="3"/>
  <line x1="555" y1="146" x2="555" y2="174" stroke="#333" stroke-width="4"/>
  <line x1="545" y1="146" x2="545" y2="174" stroke="#333" stroke-width="4"/>
  <line x1="543" y1="160" x2="520" y2="160" stroke="#222" stroke-width="3"/>
  <circle cx="580" cy="160" r="5" fill="#c62828"/><circle cx="520" cy="160" r="5" fill="#222"/>
  <text x="550" y="200" text-anchor="middle" font-size="12" fill="#5d6d69">1000µF</text>

  <!-- SIM800L -->
  <rect x="620" y="70" width="240" height="270" rx="12" fill="#e9f2ff" stroke="#1f5fbf" stroke-width="2"/>
  <text x="740" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1f5fbf">SIM800L</text>
  <text class="fa" x="740" y="124" text-anchor="middle" font-size="12" fill="#1f5fbf">سیم‌کارت و آنتن را حتماً بگذار</text>
  <text class="pin" x="636" y="165">NET</text><text class="fa small" x="790" y="165">← آنتن</text>
  <text class="pin" x="636" y="195">VCC</text>
  <text class="pin" x="636" y="225">RST</text>
  <text class="pin" x="636" y="255">RXD</text>
  <text class="pin" x="636" y="285">TXD</text>
  <text class="pin" x="636" y="315">GND</text>
  <g fill="#1f5fbf"><circle cx="620" cy="190" r="5"/><circle cx="620" cy="220" r="5"/><circle cx="620" cy="250" r="5"/><circle cx="620" cy="280" r="5"/><circle cx="620" cy="310" r="5"/></g>
  <path d="M860 160 l46 -34 l0 68 z" fill="#1f5fbf" opacity=".45"/>

  <!-- ESP32 -->
  <rect x="40" y="370" width="260" height="290" rx="12" fill="#e6f4ea" stroke="#137a3f" stroke-width="2"/>
  <text x="170" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#137a3f">ESP32 DevKit</text>
  <text class="fa" x="170" y="424" text-anchor="middle" font-size="12" fill="#137a3f">با کابل USB به کامپیوتر</text>
  <g class="pin" text-anchor="end">
    <text x="288" y="445">GPIO4</text>
    <text x="288" y="495">GPIO17 (TX2)</text>
    <text x="288" y="545">GPIO16 (RX2)</text>
    <text x="288" y="625">GND</text>
  </g>
  <g fill="#137a3f"><circle cx="300" cy="440" r="5"/><circle cx="300" cy="490" r="5"/><circle cx="300" cy="540" r="5"/><circle cx="300" cy="620" r="5"/></g>

  <!-- GPIO4 -> RST (optional) -->
  <polyline points="300,440 470,440 470,220 620,220" fill="none" stroke="#7b3fbf" stroke-width="3" stroke-dasharray="8 5"/>
  <text class="fa" x="395" y="432" text-anchor="middle" font-size="12" fill="#7b3fbf">اختیاری</text>

  <!-- GPIO17 -> divider -> RXD -->
  <polyline points="300,490 340,490" fill="none" stroke="#e07a00" stroke-width="3"/>
  <rect x="340" y="476" width="80" height="28" rx="6" fill="#fff3e0" stroke="#e07a00" stroke-width="2"/>
  <text class="fa" x="380" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#b85c00">مقسم ولتاژ</text>
  <polyline points="420,490 490,490 490,250 620,250" fill="none" stroke="#e07a00" stroke-width="3"/>
  <line x1="380" y1="504" x2="380" y2="620" stroke="#e07a00" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="380" cy="620" r="4" fill="#222"/>

  <!-- SIM TXD -> GPIO16 -->
  <polyline points="620,280 560,280 560,540 300,540" fill="none" stroke="#0f6e5f" stroke-width="3"/>

  <text class="fa" x="410" y="648" text-anchor="middle" font-size="13" font-weight="700">زمین مشترک (خیلی مهم)</text>

  <!-- divider inset -->
  <rect x="610" y="380" width="360" height="120" rx="10" fill="#fff8ef" stroke="#e07a00"/>
  <text class="fa" x="955" y="402" font-size="13" font-weight="700" fill="#b85c00">داخل «مقسم ولتاژ»: ۳٫۳ ولت را به ۲٫۲ ولت می‌رساند</text>
  <text class="pin" x="626" y="452" font-size="13">GPIO17</text>
  <line x1="690" y1="447" x2="715" y2="447" stroke="#e07a00" stroke-width="3"/>
  <rect x="715" y="438" width="54" height="18" fill="#fff" stroke="#e07a00" stroke-width="2"/>
  <text x="742" y="432" text-anchor="middle" font-size="12" fill="#b85c00">1kΩ</text>
  <line x1="769" y1="447" x2="880" y2="447" stroke="#e07a00" stroke-width="3"/>
  <text class="pin" x="886" y="452" font-size="13">RXD</text>
  <circle cx="820" cy="447" r="4" fill="#e07a00"/>
  <line x1="820" y1="447" x2="820" y2="458" stroke="#e07a00" stroke-width="3"/>
  <rect x="811" y="458" width="18" height="26" fill="#fff" stroke="#e07a00" stroke-width="2"/>
  <text x="836" y="476" font-size="12" fill="#b85c00">2kΩ</text>
  <line x1="820" y1="484" x2="820" y2="492" stroke="#222" stroke-width="3"/>
  <text class="pin" x="872" y="492" font-size="12">→ GND</text>

  <!-- notes -->
  <g class="fa" font-size="13" fill="#16211f">
    <text x="970" y="532" font-weight="700" fill="#c62828">⚠ SIM800L را هرگز به پین ۵ یا ۳٫۳ ولت ESP32 وصل نکن</text>
    <text x="970" y="556">• TX و RX ضربدری‌اند: TX هر برد به RX برد دیگر</text>
    <text x="970" y="580">• سیم‌های VCC و GND ماژول کوتاه و کلفت باشند</text>
    <text x="970" y="604">• برد «SIM800L EVB» (پین 5V دارد): به ۵ ولت آداپتور، بی‌مقسم</text>
    <text x="970" y="628">• ESP32-WROVER؟ به‌جای پین ۱۶ و ۱۷ از ۲۶ و ۲۷ استفاده کن</text>
    <text x="970" y="652">• چراغ ماژول: هر ۳ ثانیه یعنی در شبکه است ✓، هر ۱ ثانیه یعنی دنبال شبکه</text>
  </g>
</svg>
