name: Android app build
on:
  push:
    paths: ["android/**", "server/app/**", "server/api.php", "server/assistant*.php", "tools/android-shots.sh", "tools/voice-model/**", "tools/local-app/**", "tools/demo/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key from the repository secrets (never in the repository itself)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bank.keystore"
            echo "BANK_KEYSTORE=$RUNNER_TEMP/bank.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret missing: the APK is built but not published (it would not install over the real app)"
          fi
      - name: Persian voice model (Piper «amir», sherpa-onnx)
        run: sh tools/voice-model/fetch.sh android
      - name: The web app with its own books (the mode without a server)
        run: sh tools/local-app/build.sh android/app/src/main/assets/www
      - name: Build the APKs
        env:
          BANK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BANK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BANK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # only the keystore file is the secret: without the other secrets, its default password and alias
          export BANK_KEYSTORE_PASSWORD="${BANK_KEYSTORE_PASSWORD:-bank-assistant}" BANK_KEY_ALIAS="${BANK_KEY_ALIAS:-sideload}"
          export BANK_KEY_PASSWORD="${BANK_KEY_PASSWORD:-$BANK_KEYSTORE_PASSWORD}"
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleRelease
          ls -la app/build/outputs/apk/*/*.apk
          # GitHub keeps files up to 100 MB, and your own server hands this to the phone
          [ "$(stat -c %s app/build/outputs/apk/release/app-release.apk)" -lt 95000000 ] || { echo "::error::release APK too big"; exit 1; }
      - name: Demo server (sample books) and a pretend Bale
        run: |
          sh tools/demo/run.sh /tmp/demo
          (nohup python3 tools/demo/fakebale.py 8841 > /tmp/fakebale-server.log 2>&1 &)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh tools/android-shots.sh shots
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bank.keystore"
      - name: Keep the APK and screenshots in the repo
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p server/app/android android/screenshots
          # the real key when the ANDROID_KEYSTORE_B64 secret is set; otherwise a temporary one
          # (then a later signed build needs one uninstall)
          # the APK only from a run whose tests passed; screenshots always (to see what went wrong)
          if [ "$JOB_STATUS" = success ]; then cp android/app/build/outputs/apk/release/app-release.apk server/app/android/bank-assistant.apk; fi
          cp shots/*.png shots/voice-test.txt shots/local-test.txt android/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f server/app/android/bank-assistant.apk android/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Android APK and emulator screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
