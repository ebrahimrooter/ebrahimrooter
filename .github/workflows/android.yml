name: Android app build
on:
  push:
    paths: ["android/**", "server/app/**", "server/api.php", "server/assistant*.php", "tools/android-shots.sh", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APKs
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Demo server (sample books)
        run: sh tools/demo/run.sh /tmp/demo
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh tools/android-shots.sh shots
      - name: Keep the APK and screenshots in the repo
        if: github.event_name == 'push'
        run: |
          mkdir -p server/app/android android/screenshots
          cp android/app/build/outputs/apk/release/app-release.apk server/app/android/bank-assistant.apk
          cp shots/*.png android/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/android/bank-assistant.apk android/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Android APK and emulator screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
