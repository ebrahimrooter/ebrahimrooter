name: Android app build
on:
  push:
    paths: ["android/**", "server/app/**", "server/api.php", "server/assistant*.php", "tools/android-shots.sh", "tools/voice-model/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key from the repository secrets (never in the repository itself)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bank.keystore"
            echo "BANK_KEYSTORE=$RUNNER_TEMP/bank.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret missing: the APK is built but not published (it would not install over the real app)"
          fi
      - name: Persian voice model (Piper «amir», sherpa-onnx)
        run: sh tools/voice-model/fetch.sh android
      - name: Build the APKs
        env:
          BANK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BANK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BANK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleRelease
          ls -la app/build/outputs/apk/*/*.apk
          # GitHub releases keep files up to 2 GB; keep the download reasonable for a phone
          [ "$(stat -c %s app/build/outputs/apk/release/app-release.apk)" -lt 300000000 ] || { echo "::error::release APK too big"; exit 1; }
      - name: Demo server (sample books)
        run: sh tools/demo/run.sh /tmp/demo
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh tools/android-shots.sh shots
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bank.keystore"
      - name: Publish the APK (GitHub release android-latest; too big for git)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bank-assistant.apk
          if [ "${SIGNED:-0}" = 1 ]; then NOTE="Signed with the app key: installs over the previous version."; else NOTE="Signed with a temporary key (the ANDROID_KEYSTORE_B64 secret is missing): uninstall the old app first."; fi
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Android app (latest build)" --notes "$NOTE" --target "$GITHUB_SHA"
          gh release edit android-latest --notes "$NOTE ($(date -u +%Y-%m-%d) ${GITHUB_SHA:0:7})"
          gh release upload android-latest bank-assistant.apk --clobber
      - name: Keep the screenshots in the repo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p android/screenshots
          cp shots/*.png shots/voice-test.txt android/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Android emulator screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
