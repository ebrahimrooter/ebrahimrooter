name: iOS app build
on:
  push:
    paths: ["ios/**", "tools/voice-model/**", "tools/local-app/**", "tools/demo/fakebale.py", "server/app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Persian voice model (Piper «amir», sherpa-onnx)
        run: sh tools/voice-model/fetch.sh ios
      - name: The web app with its own books (the mode without a server)
        run: sh tools/local-app/build.sh ios/BankAssistant/Resources/www
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build for the simulator (no signing)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -version
          xcodebuild -project BankAssistant.xcodeproj -scheme BankAssistant -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build | xcpretty
          rm -rf build/Debug-iphonesimulator && mkdir -p build && cp -R build/dd/Build/Products/Debug-iphonesimulator build/
          du -sh build/Debug-iphonesimulator/BankAssistant.app
      - name: Simulator screenshots (sample data)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')][0])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" ios/build/Debug-iphonesimulator/BankAssistant.app
          BID=ir.example.bankassistant
          mkdir -p shots
          shot() { name=$1; shift; xcrun simctl terminate "$UDID" $BID || true; xcrun simctl launch "$UDID" $BID "$@"; sleep 8; xcrun simctl io "$UDID" screenshot "shots/$name.png"; }
          # the app's own Persian voice: number rules = the server's, and it speaks
          xcrun simctl launch "$UDID" $BID -demo -voicetest
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          for i in $(seq 1 60); do [ -s "$DATA/Documents/voice-test.txt" ] && break; sleep 2; done
          echo "--- voice test"; cat "$DATA/Documents/voice-test.txt" || true; echo
          cp "$DATA/Documents/voice-test.txt" "$DATA/Documents/voice-test.wav" shots/ 2>/dev/null || true
          grep -q "speech_text=5/5" shots/voice-test.txt && grep -q "tts=ok" shots/voice-test.txt && grep -q "stt=ok" shots/voice-test.txt || { echo "::error::voice test failed"; xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "BankAssistant"' | grep -i -E "voice|sherpa|onnx" | tail -40; exit 1; }
          shot 1-onboarding -onboarding
          shot 2-home -demo
          shot 3-report -demo -tab report
          shot 4-profile -demo -tab profile
          shot 11-stock -demo -tab stock
          shot 12-cards -demo -sheet stack
          shot 13-card-orb -demo -sheet card
          shot 14-card-otp -demo -sheet otp
          shot 15-island -demo -sheet island
          shot 5-assistant -demo -sheet assistant
          shot 6-confirm -demo -sheet tx
          shot 7-manual -demo -sheet manual
          shot 8-list -demo -sheet list
          shot 9-pip -demo -sheet pip
          # last: the mode without a server against a pretend Bale (it stays on afterwards)
          (nohup python3 tools/demo/fakebale.py 8841 > /tmp/fakebale-server.log 2>&1 &)
          sleep 2
          xcrun simctl terminate "$UDID" $BID || true
          xcrun simctl launch "$UDID" $BID -localToken 123456789:test-token-abcdef -baleBase http://localhost:8841
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/16-local.png
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          python3 - "$DATA/Library/Application Support/local-books.json" <<'PY' | tee shots/local-test.txt
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except Exception as e:
              print("local=fail no books file:", e); sys.exit(0)
          t = {x.get("bale_mid"): x for x in s.get("txs", [])}
          a, b = t.get(10), t.get(11)
          ok = (s.get("bale", {}).get("chat_id") == "555" and a and a["status"] == "pending" and a["amount"] == 2500000
                and b and b["status"] == "confirmed" and b.get("party") == "علی رضایی")
          print("local=" + ("ok" if ok else "fail"), "chat=", s.get("bale", {}).get("chat_id"), "txs=", len(s.get("txs", [])), "last_error=", s.get("bale", {}).get("last_error"))
          PY
          grep -E "^(sendMessage|editMessageReplyMarkup|answerCallbackQuery)" /tmp/fakebale.log | cut -c1-120 | tee -a shots/local-test.txt || true
          echo "--- pretend Bale from the Mac:"; curl -s -m 5 -H 'Content-Type: application/json' -d '{}' http://localhost:8841/bot1:x/getMe || echo "not reachable"
          echo "--- app:"; head -60 "$DATA/Library/Application Support/local-debug.txt" | tee -a shots/local-test.txt || true
          grep -q "local=ok" shots/local-test.txt || { echo "::error::local mode test failed"; xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "BankAssistant"' | grep -i -E "bankapp|webkit|local|bale|error" | tail -40; exit 1; }
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/10-pip-over-settings.png || true
          echo "--- bundle"; ls ios/build/Debug-iphonesimulator/BankAssistant.app | grep -i -E "mp4|orb" || echo "no orb videos in the app"
          echo "--- app log"; xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'subsystem == "ir.example.bankassistant" OR (process == "BankAssistant" AND (eventMessage CONTAINS[c] "picture" OR eventMessage CONTAINS[c] "pip"))' | tail -60 || true
      - name: Keep the screenshots in the repo (ios/screenshots)
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p ios/screenshots
          for f in shots/*.png; do sips -Z 1200 "$f" --out "ios/screenshots/$(basename "$f")" >/dev/null; done
          cp shots/voice-test.txt shots/local-test.txt ios/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/screenshots
          git diff --cached --quiet || { git commit -m "iOS screenshots from the simulator [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done; }
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-screens
          path: shots
